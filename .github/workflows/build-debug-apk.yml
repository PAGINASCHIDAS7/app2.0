
name: Build Analista Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Print build tool versions
        run: |
          java -version
          gradle --version
          sdkmanager --version

      - name: Build debug APK
        run: gradle --no-daemon --max-workers=1 --no-parallel --stacktrace :app:assembleDebug

      - name: Verify APK package and SDK levels
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.analistapro.app'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "sdkVersion:'33'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -t "$APK" | tail -n 2

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Analista-Pro-Android-1.1.2-StartupFix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
